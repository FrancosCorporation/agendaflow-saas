services:
  agendaflow:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3111}:${PORT:-3111}"
    environment:
      PORT: ${PORT:-3111}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente ou no arquivo .env}
      AGENDAFLOW_DB: /data/agendaflow.db
    volumes:
      - dados:/data
    restart: unless-stopped

volumes:
  dados:
